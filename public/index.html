<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSH Web Terminal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.5.0/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    
    <div id="connection-form" class="login-form">
      <div class="form-group">
        <label for="host">Host</label>
        <input type="text" id="host" placeholder="example.com or 192.168.1.1" value="localhost">
      </div>
      
      <div class="form-group">
        <label for="port">Port</label>
        <input type="number" id="port" value="22">
      </div>
      
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="username" value="username">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="password">
      </div>
      
      <button id="connect-btn">SSH</button>
      
      <div id="status-message" class="status hidden"></div>
    </div>
    
    <div id="terminal-section" class="hidden">
      <!-- Container where the text area is created -->
      <div id="terminal-container"></div>

      <div class="terminal-actions">
        <button id="disconnect-btn" class="disconnect-btn">Disconnect</button>
      </div>
    </div>
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.5.0/xterm.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/3.5.1/addons/fit/fit.js"></script>
  <script src="app.js"></script>

</body>
</html>
